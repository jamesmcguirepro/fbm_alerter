services:
  # Runs scheduled searches (e.g. via host cron / DSM Task Scheduler):
  #   docker compose run --rm marketplace-monitor exec
  # Pulls the published image; use docker-compose.build.yml to build locally.
  marketplace-monitor:
    image: trailstack/fbm_alerter:${IMAGE_TAG:-1.0.0}
    env_file: .env
    environment:
      - RUBY_ENV=development
    volumes:
      # For Synology/QNAP, bind-mount a NAS share instead of a named volume:
      #   - /volume1/docker/fbm_alerter/data:/app/storage
      - marketplace-monitor-data:/app/storage
    command: exec

  # Web GUI: docker compose up -d web   → http://<nas-ip>:9292
  web:
    image: trailstack/fbm_alerter:${IMAGE_TAG:-1.0.0}
    env_file: .env
    environment:
      - RUBY_ENV=development
      - PORT=9292
    volumes:
      # Same data volume so the GUI reads the same SQLite database
      - marketplace-monitor-data:/app/storage
    ports:
      - "9292:9292"
    command: web

volumes:
  marketplace-monitor-data:
