services:
  # One-shot job: runs all saved searches and exits.
  #   docker compose run --rm marketplace-monitor exec
  # The "tools" profile keeps it out of a plain `up` / Container Manager
  # project start, so its normal exit isn't reported as an unexpected stop.
  # Pulls the published image; use docker-compose.build.yml to build locally.
  marketplace-monitor:
    image: trailstack/fbm_alerter:${IMAGE_TAG:-1.0.2}
    profiles: ["tools"]
    env_file: .env
    environment:
      - RUBY_ENV=development
    volumes:
      # For Synology/QNAP, bind-mount a NAS share instead of a named volume:
      - /volume1/homes/docker/fbm_alerter/data:/app/storage
    command: exec

  # Web GUI: docker compose up -d web   → http://<nas-ip>:9292
  web:
    image: trailstack/fbm_alerter:${IMAGE_TAG:-1.0.2}
    env_file: .env
    environment:
      - RUBY_ENV=development
      - PORT=9292
    volumes:
      - /volume1/homes/docker/fbm_alerter/data:/app/storage
    ports:
      - "9292:9292"
    command: web

volumes:
  marketplace-monitor-data:
