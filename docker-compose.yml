services:
  # Web GUI: docker compose up -d web   → http://<nas-ip>:9292
  web:
    image: trailstack/fbm_alerter:${IMAGE_TAG:-1.0.11}
    # Names this container in the alert footer ("Sent by ..."), so an alert from
    # the NAS is distinguishable from one sent by a local run. A container's
    # hostname is otherwise its container id, which changes on every recreate.
    hostname: james-nas
    env_file: .env
    environment:
      - RUBY_ENV=development
      - PORT=9292
      - TZ=${TZ:-UTC}
    volumes:
      # All services must mount the SAME host folder, or they see different databases.
      - /volume1/docker/fbm_alerter/data:/app/storage
    ports:
      - "9292:9292"
    command: web
    restart: unless-stopped

  # Runs the searches once a day at SCHEDULE_AT (default 20:00) in TZ: no host
  # cron and no Docker socket access. It checks monitor_runs before starting,
  # so a container restart does not burn credits; if today's pass was missed,
  # it catches up on the next start.
  scheduler:
    image: trailstack/fbm_alerter:${IMAGE_TAG:-1.0.11}
    # `web` is the only service that runs migrations, and it migrates before
    # Puma starts. Waiting for web to be healthy therefore also means the
    # schema is ready, so the scheduler never writes schema_migrations.
    depends_on:
      web:
        condition: service_healthy
    hostname: james-nas
    env_file: .env
    environment:
      - RUBY_ENV=development
      - TZ=${TZ:-UTC}
    volumes:
      - /volume1/docker/fbm_alerter/data:/app/storage
    # Only `web` serves port 9292. The image's healthcheck is inherited by every
    # container, so disable it here or this one is reported unhealthy.
    healthcheck:
      test: ["NONE"]
    restart: unless-stopped
    command: schedule

  # Ad-hoc CLI runs, not started by `up`:
  #   docker compose run --rm marketplace-monitor exec
  #   docker compose run --rm marketplace-monitor list
  # Pulls the published image; use docker-compose.build.yml to build locally.
  marketplace-monitor:
    image: trailstack/fbm_alerter:${IMAGE_TAG:-1.0.11}
    profiles: ["tools"]
    # Same startup guarantee as the scheduler: web has finished migrating.
    depends_on:
      web:
        condition: service_healthy
    hostname: james-nas
    env_file: .env
    environment:
      - RUBY_ENV=development
      - TZ=${TZ:-UTC}
    volumes:
      - /volume1/docker/fbm_alerter/data:/app/storage
    # Same reason as `scheduler`: this container doesn't serve 9292.
    healthcheck:
      test: ["NONE"]
    command: exec
