services:
  # Runs scheduled searches (e.g. via host cron): docker compose run marketplace-monitor exec
  marketplace-monitor:
    build: .
    env_file: .env
    environment:
      - RUBY_ENV=development
    volumes:
      # For Synology/QNAP, bind-mount a NAS share instead of a named volume:
      #   - /volume1/docker/fbm_alerter/data:/app/storage
      - marketplace-monitor-data:/app/storage
    command: exec

  # Web GUI: docker compose up -d web   → http://<nas-ip>:9292
  web:
    build: .
    env_file: .env
    environment:
      - RUBY_ENV=development
      - PORT=9292
    volumes:
      # Same data volume so the GUI reads the same SQLite database
      - marketplace-monitor-data:/app/storage
    ports:
      - "9292:9292"
    command: web

volumes:
  marketplace-monitor-data:
